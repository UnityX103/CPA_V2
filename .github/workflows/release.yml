name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: '发布当前 main 版本（关闭时仅验证三平台打包，不上传 Release）'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/ci.yml
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          WANT_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const p=JSON.parse(fs.readFileSync('app/package.json'));
          const t=JSON.parse(fs.readFileSync('app/src-tauri/tauri.conf.json'));
          if(p.version!==t.version || !/^\d+\.\d+\.\d+$/.test(p.version)) throw Error('Invalid release version');
          const tag=`v${p.version}`;
          const publish=process.env.WANT_PUBLISH==='true';
          if(publish) {
            execFileSync('git',['merge-base','--is-ancestor','HEAD','origin/main']);
            if(process.env.GITHUB_REF_TYPE==='tag' && process.env.GITHUB_REF_NAME!==tag) throw Error('Tag/version mismatch');
            if(process.env.GITHUB_REF_TYPE!=='tag' && process.env.GITHUB_REF!=='refs/heads/main') throw Error('Publish from main only');
            const r=await fetch(`https://api.github.com/repos/UnityX103/CPA_V2/releases/tags/${tag}`,{headers:{authorization:`Bearer ${process.env.GH_TOKEN}`}});
            if(r.status===200) throw Error('Release already exists; bump version before publishing');
            if(r.status!==404) throw Error(`Release preflight HTTP ${r.status}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`tag=${tag}\npublish=${publish}\n`);
          JS
  build:
    needs: [tests, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x86_64
            bundles: app,dmg
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            bundles: app,dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64-nsis
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: rustup target add "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: app/src-tauri -> target
      - name: Build installer
        env:
          RELEASE_PUBLISH: ${{ needs.prepare.outputs.publish }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.prepare.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.prepare.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          if [ "$RELEASE_PUBLISH" = true ]; then
            test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Missing updater signing secret'; exit 1; }
            npm run tauri build -- --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}'
          else
            npm run tauri build -- --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - name: Verify macOS architecture and resource seal
        if: runner.os == 'macOS'
        env:
          EXPECTED_ARCH: ${{ matrix.platform == 'darwin-aarch64' && 'arm64' || 'x86_64' }}
        run: |
          bundle='src-tauri/target/${{ matrix.target }}/release/bundle'
          app_path="$bundle/macos/桌宠番茄钟.app"
          codesign --verify --deep --strict "$app_path"
          count=0
          while IFS= read -r -d '' item; do
            if file -b "$item" | grep -q '^Mach-O'; then
              test "$(lipo -archs "$item")" = "$EXPECTED_ARCH"
              count=$((count+1))
            fi
          done < <(find "$app_path" -type f -print0)
          test "$count" -gt 0
          for dmg in "$bundle"/dmg/*.dmg; do hdiutil verify "$dmg"; done
      - name: Stage updater assets
        if: needs.prepare.outputs.publish == 'true'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/cloud-release.mjs stage '${{ runner.temp }}/stage'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.prepare.outputs.publish == 'true'
        with:
          name: release-${{ matrix.platform }}
          path: ${{ runner.temp }}/stage
          retention-days: 3
          if-no-files-found: error
  publish:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: app
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: ${{ runner.temp }}/input
      - name: Verify all platforms and prepare signed CNB index variants
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.prepare.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.prepare.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: node app/scripts/cloud-release.mjs assemble '${{ runner.temp }}/assets' '${{ runner.temp }}/input'
      - name: Publish GitHub Latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "CPA_V2 $RELEASE_TAG" --generate-notes --draft
          gh release upload "$RELEASE_TAG" '${{ runner.temp }}/assets/'* --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          curl --fail --retry 5 --retry-all-errors --location "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/latest.json" -o '${{ runner.temp }}/online.json'
          cmp '${{ runner.temp }}/assets/latest.json' '${{ runner.temp }}/online.json'
