<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>计划编辑面板导入标注</title>
    <style>
        :root {
            --paper: #fffdfbee;
            --paper-solid: #fffdfb;
            --line: #efdccd;
            --line-soft: #e9cbb8;
            --text: #5b4636;
            --muted: #a28b79;
            --subtle: #6b7280;
            --accent: #d15f3d;
            --accent-soft: #fff1ee;
            --green: #2d8f4e;
            --gold: #e08c10;
            font-family: "MaokenAssortedSans", "CPAMaoken", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background: #f7efe7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background:
                linear-gradient(90deg, rgba(239, 220, 205, 0.45) 1px, transparent 1px),
                linear-gradient(rgba(239, 220, 205, 0.45) 1px, transparent 1px),
                #f8f1ea;
            background-size: 24px 24px;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .page {
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(520px, 1fr) 360px;
            gap: 18px;
            padding: 18px;
        }

        .workspace,
        .inspector {
            min-width: 0;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: rgba(255, 253, 251, 0.9);
            box-shadow: 0 16px 36px rgba(91, 70, 54, 0.12);
        }

        .workspace {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar,
        .inspector-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--line);
        }

        .title-block {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        h1,
        h2 {
            margin: 0;
            color: var(--text);
            line-height: 1.15;
        }

        h1 {
            font-size: 18px;
            font-weight: 800;
        }

        h2 {
            font-size: 14px;
            font-weight: 800;
        }

        .hint,
        .muted {
            margin: 0;
            color: var(--subtle);
            font-size: 12px;
            font-weight: 600;
            line-height: 1.45;
        }

        .toolbar-actions,
        .segmented,
        .io-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tool-button,
        .segmented button,
        .io-actions button,
        .file-button {
            min-height: 32px;
            padding: 0 11px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #ffffffcc;
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
        }

        .tool-button.primary,
        .segmented button.active {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
        }

        .tool-button.danger {
            color: #b4462c;
            border-color: #efc4b4;
            background: #fff7f0;
        }

        .canvas-wrap {
            flex: 1 1 auto;
            overflow: auto;
            padding: 26px;
        }

        .annotation-canvas {
            position: relative;
            min-width: 520px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 20px 34px;
        }

        .annotation-canvas.adding {
            cursor: crosshair;
        }

        .panel-shell {
            position: relative;
            width: 460px;
        }

        .review-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 0 0 10px;
            padding: 5px 9px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 12px;
            font-weight: 800;
        }

        .checkin-editor-panel {
            box-sizing: border-box;
            width: 460px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 16px;
            overflow: visible;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: var(--paper);
            color: var(--text);
            box-shadow: 0 18px 36px rgba(91, 70, 54, 0.12);
        }

        .checkin-editor-head,
        .checkin-editor-section-head,
        .checkin-editor-actions,
        .checkin-editor-item-top,
        .checkin-editor-item-name,
        .checkin-editor-item-actions,
        .checkin-editor-repeat-controls {
            display: flex;
            align-items: center;
        }

        .checkin-editor-head,
        .checkin-editor-section-head,
        .checkin-editor-actions {
            justify-content: space-between;
            gap: 12px;
        }

        .checkin-editor-head {
            align-items: flex-start;
        }

        .checkin-editor-title-wrap {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .checkin-editor-title-wrap h2,
        .checkin-editor-title-wrap strong {
            margin: 0;
            color: var(--text);
            font-weight: 800;
            line-height: 1.12;
        }

        .checkin-editor-title-wrap h2 {
            font-size: 20px;
            font-weight: 700;
        }

        .checkin-editor-title-wrap p {
            margin: 0;
            color: #7c6858;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.25;
        }

        .checkin-editor-content-head .checkin-editor-title-wrap strong {
            font-size: 14px;
        }

        .checkin-editor-content-head .checkin-editor-title-wrap p {
            color: var(--subtle);
            font-size: 12px;
            font-weight: 600;
        }

        .checkin-editor-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: #ffffffb8;
        }

        .checkin-editor-items-section {
            gap: 12px;
        }

        .checkin-editor-primary,
        .checkin-editor-actions button {
            min-height: 30px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
        }

        .checkin-editor-primary {
            padding: 7px 10px;
            border: 1px solid var(--accent);
            background: var(--accent);
            color: #fff;
        }

        .checkin-editor-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .checkin-editor-item-row {
            --item-color: var(--accent);
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 9px;
            padding: 10px;
            border: 1px solid var(--line-soft);
            border-radius: 14px;
            background: #fffdfbe6;
            cursor: grab;
            transition: border-color 140ms ease, box-shadow 140ms ease, opacity 140ms ease, transform 140ms ease;
        }

        .checkin-editor-item-row:active {
            cursor: grabbing;
        }

        .checkin-editor-item-row.is-dragging {
            opacity: 0.58;
            transform: scale(0.992);
        }

        .checkin-editor-item-row.is-drop-target {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(209, 95, 61, 0.14);
        }

        .checkin-editor-item-top {
            justify-content: space-between;
            gap: 8px;
            width: 100%;
        }

        .checkin-editor-item-name {
            min-width: 0;
            flex: 1 1 auto;
            gap: 8px;
        }

        .checkin-item-icon-button {
            width: 26px;
            height: 26px;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            border: 0;
            border-radius: 9px;
            background: var(--accent-soft);
            color: var(--item-color);
            font-weight: 900;
        }

        .checkin-editor-item-copy {
            min-width: 0;
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .checkin-editor-item-copy input[aria-label$="标题"] {
            width: 100%;
            min-width: 0;
            height: 17px;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--text);
            font-size: 13px;
            font-weight: 800;
            line-height: 17px;
            outline: none;
        }

        .checkin-editor-item-copy p {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            margin: 0;
            overflow: hidden;
            color: #8a6a55;
            font-size: 11px;
            font-weight: 600;
            line-height: 14px;
            white-space: nowrap;
        }

        .checkin-editor-item-copy p > span {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .checkin-editor-item-actions {
            flex: 0 0 auto;
            gap: 8px;
        }

        .checkin-editor-mode-row {
            width: 84px;
            height: 28px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            padding: 3px;
            border: 1px solid #e8c4a8;
            border-radius: 999px;
            background: var(--accent-soft);
        }

        .checkin-editor-mode-row button {
            height: 20px;
            padding: 0;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: var(--muted);
            font-size: 10px;
            font-weight: 800;
        }

        .checkin-editor-mode-row button.active {
            background: var(--accent);
            color: #ffffff;
        }

        .checkin-editor-row-action {
            width: 16px;
            height: 24px;
            display: inline-grid;
            place-items: center;
            padding: 0;
            border: 0;
            background: transparent;
            color: #c0a996;
            line-height: 1;
        }

        .checkin-editor-row-action svg {
            width: 14px;
            height: 14px;
            display: block;
            stroke-width: 2.2;
        }

        .checkin-editor-item-controls {
            width: 100%;
        }

        .checkin-editor-repeat-controls {
            gap: 8px;
        }

        .checkin-editor-cycle-select {
            width: 94px;
            height: 31px;
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 7px 8px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            background: #ffffffcc;
            color: var(--text);
        }

        .checkin-editor-cycle-select span {
            color: var(--accent);
            font-size: 13px;
        }

        .checkin-editor-cycle-select strong {
            color: var(--text);
            font-size: 11px;
            font-weight: 800;
        }

        .checkin-editor-repeat-days {
            flex: 1 1 auto;
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 5px;
        }

        .checkin-editor-repeat-days button {
            min-width: 0;
            height: 28px;
            border: 1px solid #e5e7eb;
            border-radius: 9px;
            background: #ffffffcc;
            color: var(--muted);
            font-size: 11px;
            font-weight: 800;
        }

        .checkin-editor-repeat-days button.active {
            border-color: var(--accent);
            background: var(--accent);
            color: #ffffff;
        }

        .checkin-editor-count-grid {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .checkin-editor-count-grid .checkin-editor-field:nth-child(1) {
            width: 112px;
        }

        .checkin-editor-count-grid .checkin-editor-field:nth-child(2) {
            width: 76px;
        }

        .checkin-editor-count-grid .checkin-editor-loop-stepper {
            width: 116px;
        }

        .checkin-editor-field {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .checkin-editor-count-grid .checkin-editor-field,
        .checkin-editor-count-grid .checkin-editor-loop-stepper {
            height: 36px;
            flex: 0 0 auto;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding: 6px 8px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            background: #ffffffcc;
        }

        .checkin-editor-count-grid .checkin-editor-loop-stepper {
            border-color: var(--line);
            background: #fff7f0;
        }

        .checkin-editor-count-grid .checkin-editor-field span {
            flex: 0 0 auto;
            color: var(--muted);
            font-size: 10px;
            font-weight: 800;
        }

        .checkin-editor-count-grid .checkin-editor-field input {
            width: 100%;
            height: 20px;
            min-width: 0;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--text);
            font-size: 13px;
            font-weight: 800;
            text-align: right;
            outline: none;
        }

        .checkin-editor-count-grid .checkin-editor-unit-field input {
            text-align: left;
        }

        .checkin-editor-loop-stepper button {
            width: 22px;
            height: 22px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            padding: 0;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #ffffffcc;
            color: var(--muted);
            font-size: 14px;
            font-weight: 900;
            line-height: 1;
        }

        .checkin-editor-loop-stepper button.is-plus {
            border-color: var(--accent);
            background: var(--accent);
            color: #ffffff;
        }

        .checkin-editor-loop-value {
            min-width: 0;
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
        }

        .checkin-editor-loop-value span {
            color: var(--muted);
            font-size: 10px;
            font-weight: 800;
            line-height: 1;
        }

        .checkin-editor-loop-value strong {
            color: var(--text);
            font-size: 13px;
            font-weight: 800;
            line-height: 1;
            white-space: nowrap;
        }

        .checkin-editor-actions {
            justify-content: flex-end;
            padding: 4px 0;
        }

        .checkin-editor-actions button {
            width: 104px;
            height: 34px;
            border: 1px solid var(--line);
            background: #ffffffcc;
            color: var(--muted);
        }

        .checkin-editor-actions .checkin-editor-primary {
            width: 128px;
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
        }

        .annotation-marker {
            position: absolute;
            z-index: 20;
            width: 28px;
            height: 28px;
            transform: translate(-50%, -50%);
            display: grid;
            place-items: center;
            border: 2px solid #ffffff;
            border-radius: 999px;
            background: var(--accent);
            color: #ffffff;
            font-size: 12px;
            font-weight: 900;
            box-shadow: 0 8px 18px rgba(91, 70, 54, 0.24);
        }

        .annotation-marker.active {
            background: var(--green);
        }

        .inspector {
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .inspector-body {
            flex: 1 1 auto;
            overflow: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .note-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .note-card {
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #fffdfb;
            overflow: hidden;
        }

        .note-card.active {
            border-color: var(--green);
            box-shadow: 0 0 0 2px rgba(45, 143, 78, 0.12);
        }

        .note-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 9px 10px;
            background: #fff7f0;
        }

        .note-card-head strong {
            font-size: 12px;
            color: var(--accent);
        }

        .note-card-head button {
            min-width: 28px;
            height: 26px;
            border: 1px solid #efc4b4;
            border-radius: 999px;
            background: #ffffffcc;
            color: #b4462c;
            font-size: 12px;
            font-weight: 800;
        }

        .note-card textarea {
            width: 100%;
            min-height: 88px;
            resize: vertical;
            padding: 10px;
            border: 0;
            border-top: 1px solid var(--line);
            background: #ffffffcc;
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            line-height: 1.45;
            outline: none;
        }

        .note-empty {
            min-height: 110px;
            display: grid;
            place-items: center;
            padding: 16px;
            border: 1px dashed var(--line);
            border-radius: 14px;
            color: var(--muted);
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.45;
        }

        .json-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .json-box textarea {
            width: 100%;
            min-height: 132px;
            resize: vertical;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #ffffffcc;
            color: var(--text);
            font-size: 12px;
            line-height: 1.45;
            outline: none;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 18px;
            z-index: 50;
            transform: translateX(-50%) translateY(14px);
            opacity: 0;
            pointer-events: none;
            padding: 9px 12px;
            border-radius: 999px;
            background: rgba(91, 70, 54, 0.92);
            color: #ffffff;
            font-size: 12px;
            font-weight: 800;
            transition: opacity 160ms ease, transform 160ms ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 960px) {
            .page {
                grid-template-columns: 1fr;
            }

            .inspector {
                min-height: 440px;
            }
        }

        @media (max-width: 560px) {
            .page {
                padding: 10px;
            }

            .toolbar,
            .inspector-head {
                align-items: flex-start;
                flex-direction: column;
            }

            .canvas-wrap {
                padding: 12px;
            }

            .annotation-canvas {
                min-width: 500px;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="workspace" aria-label="计划编辑面板审稿区">
            <header class="toolbar">
                <div class="title-block">
                    <h1>计划编辑面板导入标注</h1>
                    <p class="hint">选择展示状态后，点“添加注释”，再点面板上的位置。注释只保存在本浏览器。</p>
                </div>
                <div class="toolbar-actions">
                    <div class="segmented" aria-label="展示状态">
                        <button type="button" class="active" data-view="mixed">混合</button>
                        <button type="button" data-view="cycle">周期</button>
                        <button type="button" data-view="count">次数</button>
                    </div>
                    <button type="button" id="add-note" class="tool-button primary">添加注释</button>
                    <button type="button" id="clear-notes" class="tool-button danger">清空注释</button>
                </div>
            </header>

            <div class="canvas-wrap">
                <div id="annotation-canvas" class="annotation-canvas">
                    <div class="panel-shell" id="panel-shell">
                        <div class="review-label">静态审稿镜像 · CheckinPlanEditorPanel</div>
                        <div class="checkin-editor-panel" id="checkin-editor-panel">
                            <header class="checkin-editor-head">
                                <div class="checkin-editor-title-wrap">
                                    <h2 contenteditable="true" spellcheck="false">计划编辑</h2>
                                    <p contenteditable="true" spellcheck="false">每个打卡事项都可以单独设置重复周期；保存后立即作为当前计划模板</p>
                                </div>
                            </header>

                            <section class="checkin-editor-section checkin-editor-items-section" aria-label="打卡计划项目">
                                <div class="checkin-editor-section-head checkin-editor-content-head">
                                    <div class="checkin-editor-title-wrap">
                                        <strong contenteditable="true" spellcheck="false">打卡计划项目</strong>
                                        <p contenteditable="true" spellcheck="false">每个项目设置自己的重复周期，不再按某一天统一编辑</p>
                                    </div>
                                    <button type="button" class="checkin-editor-primary">+ 新增项目</button>
                                </div>

                                <div class="checkin-editor-items" id="item-list">
                                    <article class="checkin-editor-item-row repeat-plan-item-row" data-mode="cycle" draggable="true" style="--item-color: var(--gold);">
                                        <div class="checkin-editor-item-top">
                                            <div class="checkin-editor-item-name">
                                                <button type="button" class="checkin-item-icon-button" aria-label="更换 阅读 图标">书</button>
                                                <div class="checkin-editor-item-copy">
                                                    <input aria-label="阅读 标题" value="阅读">
                                                    <p>
                                                        <span>每次完成记录 30分钟</span>
                                                    </p>
                                                </div>
                                            </div>
                                            <div class="checkin-editor-item-actions">
                                                <div class="checkin-editor-mode-row" role="group" aria-label="阅读 编辑模式">
                                                    <button type="button" class="active">周期</button>
                                                    <button type="button">次数</button>
                                                </div>
                                                <button type="button" class="checkin-editor-row-action" aria-label="删除 阅读"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg></button>
                                            </div>
                                        </div>
                                        <div class="checkin-editor-repeat-controls checkin-editor-item-controls">
                                            <div class="checkin-editor-cycle-select"><span aria-hidden="true">▦</span><strong>每日重复</strong></div>
                                            <div class="checkin-editor-repeat-days">
                                                <button type="button" class="active">一</button>
                                                <button type="button" class="active">二</button>
                                                <button type="button" class="active">三</button>
                                                <button type="button" class="active">四</button>

                                            </div>
                                        </div>
                                        <div class="checkin-editor-count-grid checkin-editor-item-controls">
                                            <label class="checkin-editor-field"><span>每次数量</span><input aria-label="喝水 每次数量" type="number" value="2"></label>
                                            <label class="checkin-editor-field checkin-editor-unit-field"><span>单位</span><input aria-label="喝水 单位设置" value="杯"></label>

        <aside class="inspector" aria-label="注释面板">
            <header class="inspector-head">
                <div class="title-block">
                    <h2>审稿注释</h2>
                    <p class="hint">点击标记可定位；文本会自动保存。</p>
                </div>
                <span class="muted" id="note-count">0 条</span>
            </header>
            <div class="inspector-body">
                <div id="note-list" class="note-list"></div>
                <div class="json-box">
                    <div class="io-actions">
                        <button type="button" id="export-json">导出注释 JSON</button>
                        <button type="button" id="copy-json">复制 JSON</button>
                        <button type="button" id="import-json">导入/恢复</button>
                    </div>
                    <textarea id="json-io" spellcheck="false" placeholder="导出的注释 JSON 会显示在这里；也可以粘贴 JSON 后点击“导入/恢复”。"></textarea>
                </div>
            </div>
        </aside>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        (() => {
            const storageKey = 'cpa-v2-plan-editor-annotations';
            const canvas = document.getElementById('annotation-canvas');
            const panelShell = document.getElementById('panel-shell');
            const itemList = document.getElementById('item-list');
            const noteList = document.getElementById('note-list');
            const noteCount = document.getElementById('note-count');
            const addButton = document.getElementById('add-note');
            const clearButton = document.getElementById('clear-notes');
            const exportButton = document.getElementById('export-json');
            const copyButton = document.getElementById('copy-json');
            const importButton = document.getElementById('import-json');
            const jsonBox = document.getElementById('json-io');
            const toast = document.getElementById('toast');
            let annotations = loadAnnotations();
            let adding = false;
            let activeId = annotations[0]?.id ?? null;

            function uid() {
                return `note-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
            }

            function loadAnnotations() {
                try {
                    const parsed = JSON.parse(localStorage.getItem(storageKey) || '[]');
                    return Array.isArray(parsed) ? parsed.filter(isAnnotation) : [];
                } catch {
                    return [];
                }
            }

            function isAnnotation(value) {
                return value
                    && typeof value.id === 'string'
                    && typeof value.x === 'number'
                    && typeof value.y === 'number'
                    && typeof value.text === 'string';
            }

            function saveAnnotations() {
                localStorage.setItem(storageKey, JSON.stringify(annotations));
            }

            function showToast(message) {
                toast.textContent = message;
                toast.classList.add('show');
                window.clearTimeout(showToast.timer);
                showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 1800);
            }

            function setAdding(next) {
                adding = next;
                canvas.classList.toggle('adding', adding);
                addButton.classList.toggle('primary', adding);
                addButton.textContent = adding ? '点击面板放置' : '添加注释';
            }

            function setupPlanItemDrag() {
                if (!itemList) return;
                let draggedRow = null;
                itemList.querySelectorAll('.repeat-plan-item-row').forEach((row) => {
                    row.setAttribute('draggable', 'true');
                    row.addEventListener('dragstart', (event) => {
                        draggedRow = row;
                        row.classList.add('is-dragging');
                        if (event.dataTransfer) {
                            event.dataTransfer.effectAllowed = 'move';
                            event.dataTransfer.setData('text/plain', row.querySelector('input')?.value || '');
                        }
                    });
                    row.addEventListener('dragover', (event) => {
                        if (!draggedRow || draggedRow === row) return;
                        event.preventDefault();
                        row.classList.add('is-drop-target');
                        if (event.dataTransfer) event.dataTransfer.dropEffect = 'move';
                    });
                    row.addEventListener('dragleave', () => row.classList.remove('is-drop-target'));
                    row.addEventListener('drop', (event) => {
                        event.preventDefault();
                        row.classList.remove('is-drop-target');
                        if (!draggedRow || draggedRow === row) return;
                        const rows = Array.from(itemList.querySelectorAll('.repeat-plan-item-row'));
                        const fromIndex = rows.indexOf(draggedRow);
                        const toIndex = rows.indexOf(row);
                        if (fromIndex < toIndex) {
                            row.after(draggedRow);
                        } else {
                            row.before(draggedRow);
                        }
                        showToast('计划项顺序已调整');
                    });
                    row.addEventListener('dragend', () => {
                        itemList.querySelectorAll('.repeat-plan-item-row').forEach((item) => {
                            item.classList.remove('is-dragging', 'is-drop-target');
                        });
                        draggedRow = null;
                    });
                });
            }

            function render() {
                document.querySelectorAll('.annotation-marker').forEach((node) => node.remove());
                annotations.forEach((note, index) => {
                    const marker = document.createElement('button');
                    marker.type = 'button';
                    marker.className = `annotation-marker ${note.id === activeId ? 'active' : ''}`;
                    marker.style.left = `${note.x * 100}%`;
                    marker.style.top = `${note.y * 100}%`;
                    marker.textContent = String(index + 1);
                    marker.setAttribute('aria-label', `查看注释 ${index + 1}`);
                    marker.addEventListener('click', (event) => {
                        event.stopPropagation();
                        activeId = note.id;
                        render();
                    });
                    panelShell.appendChild(marker);
                });

                noteList.innerHTML = '';
                noteCount.textContent = `${annotations.length} 条`;
                if (annotations.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'note-empty';
                    empty.textContent = '暂无注释。点击“添加注释”，再点击面板上需要指出的位置。';
                    noteList.appendChild(empty);
                    return;
                }

                annotations.forEach((note, index) => {
                    const card = document.createElement('article');
                    card.className = `note-card ${note.id === activeId ? 'active' : ''}`;
                    card.addEventListener('click', () => {
                        activeId = note.id;
                        render();
                    });

                    const head = document.createElement('div');
                    head.className = 'note-card-head';

                    const title = document.createElement('strong');
                    title.textContent = `注释 ${index + 1}`;
                    head.appendChild(title);

                    const remove = document.createElement('button');
                    remove.type = 'button';
                    remove.textContent = '删';
                    remove.setAttribute('aria-label', `删除注释 ${index + 1}`);
                    remove.addEventListener('click', (event) => {
                        event.stopPropagation();
                        annotations = annotations.filter((item) => item.id !== note.id);
                        if (activeId === note.id) activeId = annotations[0]?.id ?? null;
                        saveAnnotations();
                        render();
                    });
                    head.appendChild(remove);

                    const textarea = document.createElement('textarea');
                    textarea.value = note.text;
                    textarea.placeholder = '描述导入不一致的位置、期望效果或 Pencil 节点线索。';
                    textarea.addEventListener('click', (event) => event.stopPropagation());
                    textarea.addEventListener('input', () => {
                        note.text = textarea.value;
                        saveAnnotations();
                    });

                    card.appendChild(head);
                    card.appendChild(textarea);
                    noteList.appendChild(card);
                });
            }

            canvas.addEventListener('click', (event) => {
                if (!adding) return;
                if (!panelShell.contains(event.target)) return;
                if (event.target.closest('.annotation-marker')) return;

                const rect = panelShell.getBoundingClientRect();
                const x = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
                const y = Math.min(1, Math.max(0, (event.clientY - rect.top) / rect.height));
                const id = uid();
                annotations.push({
                    id,
                    x,
                    y,
                    text: '',
                    createdAt: new Date().toISOString(),
                    view: document.querySelector('.segmented button.active')?.dataset.view || 'mixed',
                });
                activeId = id;
                setAdding(false);
                saveAnnotations();
                render();
            });

            addButton.addEventListener('click', () => setAdding(!adding));

            clearButton.addEventListener('click', () => {
                if (annotations.length === 0) return;
                annotations = [];
                activeId = null;
                saveAnnotations();
                render();
                showToast('注释已清空');
            });

            exportButton.addEventListener('click', () => {
                const payload = {
                    page: 'plan-editor-annotation',
                    exportedAt: new Date().toISOString(),
                    annotations,
                };
                jsonBox.value = JSON.stringify(payload, null, 2);
                const blob = new Blob([jsonBox.value], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'plan-editor-annotations.json';
                link.click();
                URL.revokeObjectURL(url);
                showToast('JSON 已生成并下载');
            });

            copyButton.addEventListener('click', async () => {
                if (!jsonBox.value.trim()) {
                    jsonBox.value = JSON.stringify({ page: 'plan-editor-annotation', annotations }, null, 2);
                }
                try {
                    await navigator.clipboard.writeText(jsonBox.value);
                    showToast('JSON 已复制');
                } catch {
                    jsonBox.select();
                    showToast('已选中 JSON，可手动复制');
                }
            });

            importButton.addEventListener('click', () => {
                try {
                    const parsed = JSON.parse(jsonBox.value);
                    const incoming = Array.isArray(parsed) ? parsed : parsed.annotations;
                    if (!Array.isArray(incoming) || !incoming.every(isAnnotation)) {
                        throw new Error('invalid annotations');
                    }
                    annotations = incoming;
                    activeId = annotations[0]?.id ?? null;
                    saveAnnotations();
                    render();
                    showToast('注释已导入');
                } catch {
                    showToast('JSON 格式不正确');
                }
            });

            document.querySelectorAll('.segmented button').forEach((button) => {
                button.addEventListener('click', () => {
                    document.querySelectorAll('.segmented button').forEach((item) => item.classList.remove('active'));
                    button.classList.add('active');
                    const view = button.dataset.view;
                    document.querySelectorAll('[data-mode]').forEach((row) => {
                        row.hidden = view !== 'mixed' && row.dataset.mode !== view;
                    });
                });
            });

            setupPlanItemDrag();
            render();
        })();
    </script>
</body>
</html>
