[package]
name = "app"
version = "0.1.29"
description = "桌宠番茄钟 (Tauri 2 重写)"
authors = ["NanZhai"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = { version = "2", features = ["protocol-asset"] }
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
futures-util = "0.3"
minisign-verify = "0.2.5"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-autostart = "2.5.1"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3"] }

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-avfoundation"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSRunLoop", "NSNotification", "NSOperation", "NSDictionary"] }
objc2-av-foundation = { version = "0.3.2", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFData"] }
objc2-core-graphics = "0.3"
objc2-vision = { version = "0.3.2", features = ["VNDetectFaceRectanglesRequest", "VNObservation", "VNRequest", "VNRequestHandler", "objc2-core-graphics"] }
block2 = "0.6"
dispatch2 = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWorkspace", "NSRunningApplication", "NSView", "NSWindow", "NSResponder", "NSEvent", "NSImage", "NSBitmapImageRep", "NSImageRep", "NSGraphicsContext", "objc2-core-graphics"] }
core-graphics = "0.25"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-msmf"] }
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_FaceAnalysis",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tauri = { version = "2", features = ["test", "protocol-asset"] }
